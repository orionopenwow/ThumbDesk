name: ADE Batch Triage Queue

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  triage-for-ade-batch:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'ade-batch') || contains(github.event.issue.labels.*.name, 'bug') || contains(github.event.issue.labels.*.name, 'enhancement')
    steps:
      - name: Acknowledge issue in ADE batch queue
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            if (!labels.includes('ade-batch')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['ade-batch'],
              });
            }
            if (context.payload.action === 'opened') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: 'Queued into the **thumbdesk. ADE Batch Auto-Fix Queue**. Approved items will be batched, fixed, tested, and presented in a single review PR.',
              });
            }
