name: Release Cross-Platform Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib
      - name: Build and package standalone ThumbDesk EXE and ZIP
        shell: pwsh
        run: ./package-release.ps1
      - name: Publish Windows Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/ThumbDesk-Windows-x64/ThumbDesk.exe
            dist-release/ThumbDesk-Windows-x64.zip
            dist-release/SHA256SUMS.txt

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Build macOS .dmg installer
        run: npx tauri build --bundles dmg
      - name: Publish macOS DMG
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri & HID dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libhidapi-dev
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Linux .AppImage and .deb installers
        run: npx tauri build --bundles deb,appimage
      - name: Publish Linux Installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
