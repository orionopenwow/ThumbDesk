name: Release Windows Standalone

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib
      - name: Build and package standalone ThumbDesk EXE and ZIP
        shell: pwsh
        run: ./package-release.ps1
      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $exe = Get-FileHash dist-release/ThumbDesk-Windows-x64/ThumbDesk.exe -Algorithm SHA256
          $zip = Get-FileHash dist-release/ThumbDesk-Windows-x64.zip -Algorithm SHA256
          @(
            "$($exe.Hash)  ThumbDesk.exe"
            "$($zip.Hash)  ThumbDesk-Windows-x64.zip"
          ) | Set-Content dist-release/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/ThumbDesk-Windows-x64/ThumbDesk.exe
            dist-release/ThumbDesk-Windows-x64.zip
            dist-release/SHA256SUMS.txt
